<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- White background with rounded corners for desktop icon display -->
  <rect width="512" height="512" rx="80" fill="white"/>

  <!-- Bar chart — 8 bars bottom-aligned at y=272 -->
  <!-- dark=#C41860  light=#EEADC8 -->

  <!-- 1: tiny, light -->
  <rect x="28"  y="252" width="46" height="20" rx="8" fill="#EEADC8"/>
  <!-- 2: very tall, dark -->
  <rect x="86"  y="72"  width="46" height="200" rx="8" fill="#C41860"/>
  <!-- 3: medium, light -->
  <rect x="144" y="152" width="46" height="120" rx="8" fill="#EEADC8"/>
  <!-- 4: medium-tall, dark -->
  <rect x="202" y="122" width="46" height="150" rx="8" fill="#C41860"/>
  <!-- 5: short, light -->
  <rect x="260" y="212" width="46" height="60"  rx="8" fill="#EEADC8"/>
  <!-- 6: tall, dark -->
  <rect x="318" y="82"  width="46" height="190" rx="8" fill="#C41860"/>
  <!-- 7: short, light -->
  <rect x="376" y="222" width="46" height="50"  rx="8" fill="#EEADC8"/>
  <!-- 8: tiny, light -->
  <rect x="434" y="242" width="46" height="30"  rx="8" fill="#EEADC8"/>

  <!-- "SDP" -->
  <text
    x="256" y="390"
    font-family="'Arial Rounded MT Bold', 'Nunito', system-ui, Arial, sans-serif"
    font-size="128" font-weight="900"
    fill="#C41860" text-anchor="middle"
  >SDP</text>

  <!-- "ANALYTICS" -->
  <text
    x="256" y="448"
    font-family="system-ui, Arial, sans-serif"
    font-size="36" font-weight="400"
    fill="#EEADC8" text-anchor="middle" letter-spacing="10"
  >ANALYTICS</text>
</svg>
