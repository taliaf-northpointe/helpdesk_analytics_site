<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8205C"/>
      <stop offset="100%" stop-color="#A50E42"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>
  <!-- N letterform -->
  <text x="256" y="348" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="288" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="auto" letter-spacing="-4">N</text>
  <!-- Small bar chart accent at bottom-right -->
  <rect x="318" y="368" width="26" height="52" rx="5" fill="white" opacity="0.25"/>
  <rect x="352" y="348" width="26" height="72" rx="5" fill="white" opacity="0.35"/>
  <rect x="386" y="358" width="26" height="62" rx="5" fill="white" opacity="0.2"/>
</svg>
